<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE JUKEBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* overflow-x:hidden on body alone doesn't reliably stop the outer viewport from scrolling
     sideways if a descendant briefly computes wider than the page (e.g. during an iOS rotation,
     which sweeps through many transient widths) - set it on html too as a hard backstop, since
     nothing on this page is meant to scroll horizontally at the document level anyway */
  html { font-size: 113%; overflow-x: hidden; }
  @media (max-width: 640px) {
    html { font-size: 119%; }
  }
  :root {
    --ctrl-h: 38px;
    --chip-h: 30px;
    --ground: #161310;
    --ground-2: #211c17;
    --well: #0a0807;
    --cream: #e7ddcc;
    --cream-soft: #c4bba9;
    --cream-faint: #a29988;
    --line: rgba(255, 244, 225, 0.08);
    --line-strong: rgba(255, 244, 225, 0.16);
    --orange: #e8763a;
    --orange-ink: #1a0e06;
    --danger: #e0574a;
    --danger-ink: #1c0906;
    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --body: "Work Sans", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    position: relative;
    overflow-x: hidden;
    background-color: var(--ground);
    color: var(--cream);
    font-family: var(--body);
    font-size: 0.88rem;
    line-height: 1.5;
    min-height: 100vh;
  }
  h1, h2, h3, h4 { margin: 0; font-family: var(--display); font-weight: 600; text-wrap: balance; }
  ::selection { background: var(--orange); color: var(--orange-ink); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 30px 24px 56px; }

  /* ---------- hero: wordmark + tagline rule ---------- */
  .hero { position: relative; z-index: 0; container-type: inline-size; }
  .wordmark {
    font-family: var(--display); font-weight: 800; color: var(--cream);
    /* sized so the wordmark's own width reaches the stats row's halfway divider, never past it */
    font-size: min(5.3rem, calc(100vw / 12));
    font-size: min(5.3rem, 8.25cqw);
    line-height: 1.05;
    letter-spacing: -0.01em; white-space: nowrap;
  }
  .wordmark .o {
    position: relative; display: inline-block; vertical-align: baseline;
    width: 1.3em; height: 0.74em; margin: 0 0.05em;
    border: 0.12em solid var(--cream); border-radius: 999px;
  }
  .wordmark .o svg {
    position: absolute; left: 50%; top: 50%; width: 0.5em; height: 0.34em;
    transform: translate(-50%, -50%); fill: var(--orange);
  }
  .meta-row {
    display: flex; align-items: center; gap: 18px;
    margin-top: 14px;
    font-family: var(--display); font-weight: 600; font-size: 0.78rem; color: var(--cream-soft);
  }
  .meta-row .rule { flex: 1 1 auto; height: 1px; min-width: 24px; background: var(--line-strong); }
  .meta-row .lang-toggle { flex-shrink: 0; }

  /* ---------- stats: plain read-outs, no chrome ---------- */
  .stats-strip { position: relative; z-index: 1; margin: 16px 0 18px; }
  .stats-strip:empty { display: none; }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stat-item {
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    gap: 5px; min-width: 0; text-align: left;
    padding-right: 20px; border-right: 1px solid var(--line-strong);
  }
  .stat-item:not(:first-child) { padding-left: 20px; }
  .stat-item:last-child { border-right: none; padding-right: 0; }
  .stat-val {
    font-family: var(--display); color: var(--orange); font-weight: 700; font-size: 1.9rem;
    font-variant-numeric: tabular-nums;
  }
  .stat-label { font-size: 0.78rem; color: var(--cream-faint); }
  @media (max-width: 640px) {
    .stat-item { padding-inline: 8px; }
    .stat-item:first-child { padding-left: 0; }
    .stat-val { font-size: 1.4rem; }
    .stat-label { font-size: 0.7rem; }
  }
  @media (max-width: 420px) {
    .stat-val { font-size: 1.2rem; }
  }

  .lang-toggle { display: inline-flex; gap: 10px; }
  .lang-btn {
    /* fixed to match .layout-btn's width (var(--ctrl-h)) so the EN/RU pair and the layout-toggle
       pair - each right-flushed to the same edge, each with the same 10px gap - form two aligned
       columns on wide screens instead of drifting apart by a few px of auto-sized text padding */
    width: var(--ctrl-h);
    height: var(--chip-h); padding: 0; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; border: 1px solid var(--line-strong);
    background: transparent; color: var(--cream-faint);
    font-family: var(--display); font-size: 0.64rem; font-weight: 500; cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease;
  }
  .lang-btn:hover { color: var(--cream); border-color: var(--cream-faint); }
  .lang-btn.active { color: var(--orange); border-color: var(--orange); }

  /* ---------- controls ---------- */
  .controls, #statusBanner, .chips, .count-tag, .grid, .foot { position: relative; z-index: 1; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  /* basis:0 keeps flex-wrap's line-breaking decision from seeing a large hypothetical size (that
     caused it to wrap early before - see the max-width comment below); grow:1 fills available
     space up to max-width, which caps it at 2/3 of the row (minus half the 10px gap) so its right
     edge lines up with the divider between the 2nd and 3rd stat columns above. On narrow screens
     there's less free space than that cap, so it just fills what's there and can still shrink. */
  .search-box { position: relative; flex: 1 1 0; min-width: 0; max-width: calc(66.6667% - 5px); }
  .search-box input {
    width: 100%; height: var(--ctrl-h); padding: 0 16px 0 42px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: var(--ground-2); color: var(--cream);
    font: 400 0.72rem var(--body);
  }
  .search-box input::placeholder { color: var(--cream-faint); font-weight: 400; }
  .search-box input:focus { outline: none; border-color: var(--orange); }
  .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; fill: var(--cream-faint); pointer-events: none;
  }
  /* sort: a compact pill that always reads "Sort" - the real <select> sits underneath,
     fully functional, with its own chosen-option text hidden so our fixed label shows instead */
  .sort-wrap { position: relative; flex: 0 0 auto; }
  select.sort-select {
    appearance: none; -webkit-appearance: none; border-radius: 8px; cursor: pointer;
    accent-color: var(--orange); width: 116px; height: var(--ctrl-h); text-align: left;
    padding: 0 20px; border: 1px solid var(--line-strong); background: var(--ground-2); color: transparent;
    font: 400 0.72rem var(--body);
    transition: border-color 0.12s ease;
  }
  select.sort-select:hover { border-color: var(--cream-faint); }
  select.sort-select:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  select option { background: var(--ground-2); color: var(--cream); }
  .sort-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; color: var(--cream); font: 400 0.72rem var(--body); white-space: nowrap;
  }
  select option:checked, select option:hover, select option:focus {
    background: color-mix(in srgb, var(--orange) 30%, var(--ground-2)); color: var(--cream);
  }
  /* margin-left:auto soaks up whatever's left after search (capped near the stats divider) and
     sort, so the icons still land flush on the row's right edge like every other row does -
     without it, this row fell short of that edge once search-box stopped flex-growing to fill it */
  .layout-toggle { display: inline-flex; gap: 10px; margin-left: auto; }
  .layout-btn {
    width: var(--ctrl-h); height: var(--ctrl-h); display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line-strong); border-radius: 8px; cursor: pointer;
    background: var(--ground-2); color: var(--cream-faint);
    transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
  }
  .layout-btn:hover { color: var(--cream); border-color: var(--cream-faint); }
  .layout-btn.active {
    color: var(--orange); border-color: var(--orange);
    background: color-mix(in srgb, var(--orange) 12%, transparent);
  }
  .layout-btn svg { width: 15px; height: 15px; fill: currentColor; }
  @media (max-width: 640px) {
    .layout-toggle { display: none; }
    /* layout-toggle is hidden here, so sort-wrap becomes the last visible child. Give it its
       own (small) flex-grow so it fills any dead space, rather than the empty auto-margin this
       used before - but search-box needs a much bigger grow ratio (not an equal one), or the two
       split newly-available space evenly whenever search's cap *isn't* binding (true narrow
       phones), starving search down to a sliver. At the ratio below, once search's max-width
       cap does bind and freezes it (wider phones/small tablets), sort correctly inherits 100% of
       whatever's left over and grows to fill it; below that cap width, search still gets the
       lion's share and sort only stretches a little. */
    .search-box { flex-grow: 20; }
    /* explicit 116px basis (its natural non-mobile width), not auto - auto here was circular
       with the select's own width:100% (a percentage child sizing against the very wrapper
       we're trying to auto-size) and resolved degenerately at narrow widths, ballooning sort
       to 240px+ while search collapsed to just its icon */
    .sort-wrap { flex: 1 1 116px; }
    select.sort-select { width: 100%; }
  }
  .count-tag {
    font-family: var(--display); font-weight: 500; font-size: 0.8rem;
    color: var(--cream-faint); white-space: nowrap; font-variant-numeric: tabular-nums;
  }

  .chips { display: flex; row-gap: 10px; flex-wrap: wrap; }
  /* genre chips: one swipeable strip instead of a wrapped grid */
  .chip-scroll { position: relative; margin-bottom: 10px; }
  /* same "collapse when there's nothing in it" rule as .stats-strip:empty above, just needing
     :has() since this wrapper always has its (hidden) prev/next nav buttons as children even
     when #genreChips itself has no chips - otherwise an empty catalog leaves this row's own
     margin floating above the empty-state message with nothing in it.
     .filter-foot can't use the same trick: #rarityChips sits empty whenever no record happens
     to be tagged rare/limited, which is the common case with records still in the grid, not
     just the true empty-catalog case - so that row is toggled from JS instead, see renderGrid(). */
  .chip-scroll:has(#genreChips:empty) { display: none; }
  .chip-scroll::before, .chip-scroll::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 54px; pointer-events: none; z-index: 2;
    opacity: 0; transition: opacity 0.15s ease;
  }
  .chip-scroll::before { left: 0; background: linear-gradient(90deg, var(--ground) 40%, transparent); }
  .chip-scroll::after { right: 0; background: linear-gradient(270deg, var(--ground) 40%, transparent); }
  .chip-scroll.can-scroll-left::before { opacity: 1; }
  .chip-scroll.can-scroll-right::after { opacity: 1; }
  /* click arrows to page through genres with a mouse - hidden on touch/narrow, where swipe already works */
  .chip-nav {
    display: none; position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
    width: var(--chip-h); height: var(--chip-h); border-radius: 999px; align-items: center; justify-content: center;
    border: 1px solid var(--line-strong); background: var(--ground-2); color: var(--cream-soft);
    font-family: var(--body); font-size: 1.05rem; font-weight: 700; line-height: 0; padding: 0; cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease;
  }
  .chip-nav:hover { color: var(--cream); border-color: var(--cream-faint); }
  .chip-nav.prev { left: 0; }
  .chip-nav.next { right: 0; }
  @media (min-width: 641px) {
    .chip-scroll.can-scroll-left .chip-nav.prev,
    .chip-scroll.can-scroll-right .chip-nav.next { display: flex; }
  }
  #genreChips {
    margin-bottom: 0; flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; -ms-overflow-style: none;
    padding-bottom: 2px;
  }
  #genreChips::-webkit-scrollbar { display: none; }
  #genreChips .chip { flex: 0 0 auto; scroll-snap-align: start; }
  .filter-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; margin-bottom: 10px; }
  .filter-foot[hidden] { display: none; }
  .count-rule { flex: 1 1 40px; min-width: 24px; height: 1px; background: var(--line-strong); }
  /* filter chips: flat outline pills, orange when active */
  .chip {
    --chip-c: var(--orange);
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    height: var(--chip-h); padding: 0 13px; border-radius: 999px; margin-right: 10px;
    border: 1px solid var(--line-strong); background: transparent; color: var(--cream-soft);
    font: 500 0.72rem var(--display);
    cursor: pointer; user-select: none; white-space: nowrap; overflow: hidden;
    max-width: 260px;
    transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease,
      max-width 0.22s ease, margin-right 0.22s ease, padding 0.22s ease, opacity 0.18s ease,
      border-width 0.22s ease;
  }
  .chip:last-child { margin-right: 0; }
  .chip:hover { border-color: var(--cream-faint); color: var(--cream); }
  .chip.active {
    color: var(--chip-c); border-color: var(--chip-c);
    background: color-mix(in srgb, var(--chip-c) 10%, transparent);
  }
  /* when a row has an active filter, its other chips slide shut instead of just sitting dim.
     border-width must also go to 0, not just max-width - a collapsed chip otherwise keeps its
     2px border box regardless of max-width, and with many collapsed siblings ahead of it that
     residual adds up, pushing the one visible (active) chip further right the later it sits in
     the list (looked like the active pill "drifting" depending on which genre was picked) */
  .chip.collapsed {
    max-width: 0; padding-left: 0; padding-right: 0; margin-right: 0;
    border-width: 0; border-color: transparent; opacity: 0; pointer-events: none;
  }
  /* every chip carries a status dot; it lights up in the chip's own color when active */
  .chip::before {
    content: ""; width: 6px; height: 6px; flex-shrink: 0; border-radius: 50%;
    background: var(--line-strong);
  }
  .chip.active::before { background: var(--chip-c); box-shadow: 0 0 6px 1px color-mix(in srgb, var(--chip-c) 80%, transparent); }
  /* the clear button that appears next to an active chip */
  .chip-clear {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: var(--chip-h); height: var(--chip-h); border-radius: 999px; padding: 0;
    border: 1px solid var(--line-strong); background: var(--ground-2); color: var(--cream-soft);
    font-size: 0.88rem; line-height: 0; cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease;
  }
  .chip-clear:hover { color: var(--cream); border-color: var(--cream-faint); }

  /* ---------- record grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 36px 22px; }
  .card { position: relative; display: flex; flex-direction: column; cursor: pointer; }
  .cover-wrap {
    position: relative; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 10px;
    border: 1px solid var(--line-strong); background: var(--ground-2);
    box-shadow: 0 14px 26px -12px rgba(0, 0, 0, 0.85);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .card:hover .cover-wrap { transform: translateY(-2px); box-shadow: 0 18px 28px -12px rgba(0, 0, 0, 0.9); }
  .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-hint {
    position: absolute; right: 8px; bottom: 8px; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--well) 70%, transparent);
    border: 1px solid var(--line-strong);
    color: var(--cream); opacity: 0; transition: opacity 0.15s ease; pointer-events: none;
  }
  .card:hover .cover-hint, .card:focus-visible .cover-hint { opacity: 1; }
  .cover-hint svg { width: 14px; height: 14px; }
  .cover-placeholder {
    width: 100%; height: 100%;
    background:
      radial-gradient(circle at 50% 50%, var(--well) 0 6%, transparent 6.5%),
      repeating-radial-gradient(circle at 50% 50%, var(--line-strong) 0 1px, transparent 1px 8px);
    display: flex; align-items: center; justify-content: center;
  }
  .cover-placeholder span {
    font-family: var(--display); font-weight: 600; font-size: 0.72rem; color: var(--cream-faint);
    background: var(--ground-2); padding: 3px 8px; border: 1px solid var(--line-strong);
  }

  .card-meta { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .card-artist {
    font-family: var(--display); font-size: 0.72rem; font-weight: 700; line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .card-album { font-size: 0.72rem; color: var(--cream-soft); margin-top: 2px; overflow-wrap: anywhere; }
  .card-sub {
    display: flex; align-items: center; flex-wrap: wrap; gap: 0 7px; margin-top: 4px;
    font-size: 0.72rem; color: var(--cream-faint);
  }
  .card-sub span + span::before { content: "·"; margin-right: 7px; color: var(--cream); }
  .card-sub .px { color: var(--orange); }
  .vinyl-icon { display: inline-flex; flex-shrink: 0; cursor: default; }
  .vinyl-icon svg { display: block; }

  .empty-state {
    grid-column: 1 / -1;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 70px 20px; gap: 16px;
  }
  .empty-badge {
    position: relative; width: 110px; height: 110px; border-radius: 50%; background: var(--ground-2);
  }
  .empty-badge::after {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-30%, -50%);
    border-left: 24px solid var(--orange); border-block: 14px solid transparent;
  }
  .empty-state h2 { font-size: 1.1rem; }
  .empty-state p { max-width: 400px; color: var(--cream-soft); font-size: 0.82rem; line-height: 1.6; margin: 0; }

  .banner {
    border: 1px dashed var(--orange); padding: 12px 16px; font-size: 0.78rem;
    color: var(--cream-soft); margin-bottom: 20px;
  }

  .foot {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    margin-top: 56px; padding-top: 12px; border-top: 1px solid var(--line-strong);
    font-family: var(--display); font-weight: 600; font-size: 0.76rem; color: var(--cream-faint);
  }

  /* ---------- dialogs: flat rounded card ---------- */
  dialog.modal {
    --ground: #1c1712; --ground-2: #241e18; --line: #382f26; --line-strong: #4d4132; --cream-soft: #c4bba9; --cream-faint: #948a78;
    /* the local --line-strong above is too close in tone to --ground-2 to read as a visible
       edge (especially at phone screenshot compression) - use the lighter local --cream-faint
       for the outer frame specifically, leaving internal field/divider borders as they were */
    border: 1px solid var(--cream-faint); border-radius: 16px; padding: 0; width: min(480px, 92vw);
    background: var(--ground-2); color: var(--cream);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
  }
  dialog.modal::backdrop { background: rgba(8, 8, 7, 0.78); }
  .modal-inner { padding: 26px 26px 22px; }
  .modal-inner h2 {
    font-size: 1rem; font-weight: 700; color: var(--orange); margin-bottom: 20px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-family: var(--display); font-weight: 600; font-size: 0.76rem;
    color: var(--cream-faint); margin-bottom: 6px;
  }
  .field input[type="text"], .field input[type="number"], .field select, .field textarea {
    width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line-strong);
    background: var(--well); color: var(--cream); font: 400 0.88rem var(--body);
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--orange); outline: none; }
  .field textarea { resize: vertical; line-height: 1.5; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .file-row { display: flex; align-items: center; gap: 10px; }
  .file-row input[type="file"] { font: 400 0.8rem var(--body); color: var(--cream-soft); flex: 1; min-width: 0; }
  .cover-preview { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line-strong); flex-shrink: 0; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .btn-ghost, .btn-primary {
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    font: 600 0.76rem var(--display);
  }
  .btn-ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--cream-soft); }
  .btn-ghost:hover { color: var(--cream); border-color: var(--cream-faint); }
  .btn-primary { background: var(--orange); color: var(--orange-ink); border: 1px solid var(--orange); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
  .btn-danger-solid { background: var(--danger); border-color: var(--danger); color: var(--danger-ink); }
  .confirm-dialog { width: min(380px, 90vw); }
  .confirm-message { font-size: 0.8rem; color: var(--cream-soft); line-height: 1.6; margin: 0; }
  .required-hint { font-size: 0.74rem; color: var(--cream-faint); margin-top: 6px; }

  .detail-dialog { width: min(660px, 94vw); max-height: 86vh; padding: 0; }
  .detail-inner { display: flex; flex-direction: column; max-height: 86vh; position: relative; }
  .detail-close {
    position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: var(--well); color: var(--cream-soft);
    cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; z-index: 1;
  }

    var s = text || "";
    if (state.lang !== "en") return s;
    for (var i = 0; i < VINYL_COLOR_EN_WORDS.length; i++) {
      s = s.replace(VINYL_COLOR_EN_WORDS[i][0], VINYL_COLOR_EN_WORDS[i][1]);
    }
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  var VINYL_ICON_SVG = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">' +
    '<circle cx="8" cy="8" r="7" fill="currentColor" opacity="0.88"></circle>' +
    '<circle cx="8" cy="8" r="2.6" fill="var(--ground-2)"></circle>' +
    '<circle cx="8" cy="8" r="1" fill="currentColor"></circle></svg>';
  var EXPAND_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>' +
    '<circle cx="12" cy="12" r="3"></circle></svg>';

  function parsePrice(p) {
    if (!p) return null;
    var m = String(p).match(/[€$]\s?([\d,]+(?:\.\d+)?)/);
    if (!m) return null;
    var n = parseFloat(m[1].replace(/,/g, ""));
    return isNaN(n) ? null : n;
  }

  // price is free-typed catalog data (usually in Russian); fold its "~"/"от"/"from" prefixes into one
  // canonical "starting from" form, then swap that word to match the UI language
  function localizePrice(p) {
    var s = String(p || "").trim();
    s = s.replace(/^~\s*/, "от ").replace(/^from\s*/i, "от ").replace(/^от\.?\s*/i, "от ");
    return state.lang === "en" ? s.replace(/^от\s*/i, "from ") : s;
  }

  // mini-card price: bare "€NN" with no "от"/"~"/"from" prefix - full context lives in the detail dialog
  function cardPriceText(p) {
    var m = String(p || "").match(/[€$]\s?[\d,]+(?:\.\d+)?/);
    return m ? m[0].replace(/\s+/g, "") : "";
  }

  var els = {
    stats: document.getElementById("statsStrip"),
    grid: document.getElementById("gridHost"),
    chips: document.getElementById("genreChips"),
    chipsWrap: document.getElementById("genreChipsWrap"),
    chipsPrev: document.getElementById("genreChipsPrev"),
    chipsNext: document.getElementById("genreChipsNext"),
    rarityChips: document.getElementById("rarityChips"),
    filterFoot: document.querySelector(".filter-foot"),
    search: document.getElementById("searchInput"),
    sort: document.getElementById("sortSelect"),
    sortLabel: document.getElementById("sortLabel"),
    count: document.getElementById("countTag"),
    layoutBtns: Array.prototype.slice.call(document.querySelectorAll(".layout-btn")),
    langBtns: Array.prototype.slice.call(document.querySelectorAll(".lang-btn")),
    detailDialog: document.getElementById("detailDialog"),
    detailCloseBtn: document.getElementById("detailCloseBtn"),
    detailBody: document.getElementById("detailBody"),
    lightboxDialog: document.getElementById("lightboxDialog"),
    lightboxImg: document.getElementById("lightboxImg")
  };

  // tracked per-dialog (not a bare counter) so a close that the browser's own
  // "close" event fails to report - some hosts swallow it - can't double-unlock
  var lockedDialogs = [], savedScrollY = 0;
  function lockScroll(dlg) {
    if (lockedDialogs.indexOf(dlg) !== -1) return;
    if (lockedDialogs.length === 0) {
      savedScrollY = window.scrollY || window.pageYOffset || 0;
      // measure the real scrollbar width (0 if the page doesn't currently overflow, so nothing
      // to compensate for) before taking body out of flow, then pad it back in on the right so
      // removing the scrollbar for the lock doesn't shift the page's content sideways
      var scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
      document.body.style.position = "fixed";
      document.body.style.top = "-" + savedScrollY + "px";
      document.body.style.left = "0";
      document.body.style.right = "0";
      if (scrollbarWidth > 0) document.body.style.paddingRight = scrollbarWidth + "px";
    }
    lockedDialogs.push(dlg);
  }
  function unlockScroll(dlg) {
    var i = lockedDialogs.indexOf(dlg);
    if (i === -1) return;
    lockedDialogs.splice(i, 1);
    if (lockedDialogs.length === 0) {
      document.body.style.position = "";
      document.body.style.top = "";
      document.body.style.left = "";
      document.body.style.right = "";
      document.body.style.paddingRight = "";
      window.scrollTo(0, savedScrollY);
    } else {
      // a nested dialog (the lightbox) closed back into one that's still open (the detail
      // dialog) - iOS Safari can lose track of the still-open dialog's own scrollable panel
      // after repeated nested-dialog open/close cycles and stop responding to scroll gestures
      // on it. Force a reflow on its scroll container as a cheap, harmless-if-unneeded fix.
      var scrollPanel = document.querySelector(".detail-body");
      if (scrollPanel) {
        scrollPanel.style.overflowY = "hidden";
        void scrollPanel.offsetHeight;
        scrollPanel.style.overflowY = "";
      }
    }
  }
  function closeDialog(dlg) { dlg.close(); unlockScroll(dlg); }
  [els.detailDialog, els.lightboxDialog].forEach(function (d) {
    d.addEventListener("close", function () { unlockScroll(d); });
  });

  function loadCols() {
    var saved = 0;
    try { saved = parseInt(localStorage.getItem("runout.cols"), 10); } catch (e) {}
    return saved === 3 || saved === 4 ? saved : 3;
  }
  state.cols = loadCols();

  var narrowMq = window.matchMedia("(max-width: 640px)");
  function effectiveCols() {
    return narrowMq.matches ? Math.min(state.cols, 2) : state.cols;
  }
  function applyCols() {
    els.grid.style.setProperty("--cols", effectiveCols());
    els.layoutBtns.forEach(function (btn) {
      btn.classList.toggle("active", Number(btn.dataset.cols) === state.cols);
    });
    // iOS Safari has been known to skip re-running grid layout after a custom-property-driven
    // column count change during a fast rotate/rotate-back cycle, leaving stale (often
    // single-column) track sizing on screen - force a reflow as a cheap, harmless nudge
    void els.grid.offsetHeight;
  }
  applyCols();
  els.layoutBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.cols = Number(btn.dataset.cols);
      applyCols();
      try { localStorage.setItem("runout.cols", state.cols); } catch (e) {}
    });
  });
  if (narrowMq.addEventListener) narrowMq.addEventListener("change", applyCols);
  else if (narrowMq.addListener) narrowMq.addListener(applyCols);
  // orientationchange fires before iOS finishes settling the post-rotation viewport size, so
  // one delayed re-check follows the immediate one - both call the same idempotent applyCols()
  window.addEventListener("orientationchange", function () {
    applyCols();
    setTimeout(applyCols, 50);
    setTimeout(applyCols, 300);
  });
  window.addEventListener("resize", applyCols);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", applyCols);

  els.langBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.lang = btn.dataset.lang;
      try { localStorage.setItem("runout.lang", state.lang); } catch (e) {}
      applyLang();
    });
  });

  function applyLang() {
    document.getElementById("heroTag").textContent = t("heroTag");
    els.search.placeholder = t("searchPlaceholder");
    Array.prototype.forEach.call(els.sort.options, function (o) { o.textContent = t(SORT_KEYS[o.value]); });
    els.sortLabel.textContent = t("sortLabel");
    els.sort.setAttribute("aria-label", t(SORT_KEYS[els.sort.value]));
    els.layoutBtns.forEach(function (btn) {
      var label = t("layout" + btn.dataset.cols);
      btn.title = label;
      btn.setAttribute("aria-label", label);
    });
    var layoutGroup = document.querySelector(".layout-toggle");
    if (layoutGroup) layoutGroup.setAttribute("aria-label", t("layoutGroupLabel"));
    els.langBtns.forEach(function (b) { b.classList.toggle("active", b.dataset.lang === state.lang); });
    render();
  }

  function filteredSorted() {
    var q = state.search.trim().toLowerCase();
    var list = records.filter(function (r) {
      if (state.genre && genreGroupKey(r.genre) !== state.genre) return false;
      if (state.rarity && r.rarity !== state.rarity) return false;
      if (!q) return true;
      return (r.artist || "").toLowerCase().indexOf(q) !== -1 ||
             (r.album || "").toLowerCase().indexOf(q) !== -1;
    });
    list.sort(function (a, b) {
      if (state.sort === "year") {
        return (b.year || 0) - (a.year || 0);
      }
      if (state.sort === "price") {
        return (parsePrice(b.price) || 0) - (parsePrice(a.price) || 0) || compareNames(a.artist, b.artist);
      }
      if (state.sort === "added") {
        return (b.addedAt || "").localeCompare(a.addedAt || "");
      }
      return compareNames(a.artist, b.artist) || compareNames(a.album, b.album);
    });
    return list;
  }

  function appendClearButton(container, onClear) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip-clear";
    btn.textContent = "×";
    btn.setAttribute("aria-label", t("clearFilter"));
    btn.title = t("clearFilter");
    btn.addEventListener("click", onClear);
    container.appendChild(btn);
  }

  function renderChips() {
    var groups = {};
    records.forEach(function (r) { if (r.genre) groups[genreGroupKey(r.genre)] = true; });
    var keys = Object.keys(groups).sort(function (a, b) { return t(a).localeCompare(t(b)); });
    els.chips.innerHTML = "";
    keys.forEach(function (key) {
      var active = state.genre === key;
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip" + (active ? " active" : (state.genre ? " collapsed" : ""));
      chip.textContent = t(key);
      chip.addEventListener("click", function () {
        state.genre = active ? null : key;
        render();
      });
      els.chips.appendChild(chip);
    });
    if (state.genre) {
      appendClearButton(els.chips, function () { state.genre = null; render(); });
      els.chips.scrollLeft = 0;
    }
    updateChipFade();
    setTimeout(updateChipFade, 240);
  }

  function updateChipFade() {
    var el = els.chips, wrap = els.chipsWrap;
    if (!el || !wrap) return;
    wrap.classList.toggle("can-scroll-left", el.scrollLeft > 2);
    wrap.classList.toggle("can-scroll-right", el.scrollWidth - el.clientWidth - el.scrollLeft > 2);
  }
  els.chips.addEventListener("scroll", updateChipFade);
  window.addEventListener("resize", updateChipFade);
  els.chips.addEventListener("wheel", function (e) {
    if (els.chips.scrollWidth <= els.chips.clientWidth) return;
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    e.preventDefault();
    els.chips.scrollLeft += e.deltaY;
  }, { passive: false });
  els.chipsPrev.addEventListener("click", function () { els.chips.scrollBy({ left: -220, behavior: "smooth" }); });
  els.chipsNext.addEventListener("click", function () { els.chips.scrollBy({ left: 220, behavior: "smooth" }); });

  var SORT_KEYS = { artist: "sortArtist", year: "sortYear", added: "sortAdded", price: "sortPrice" };
  var RARITY_ORDER = ["limited", "rare"];
  function renderRarityChips() {
    var present = {};
    records.forEach(function (r) { if (r.rarity) present[r.rarity] = true; });
    var keys = RARITY_ORDER.filter(function (k) { return present[k]; });
    els.rarityChips.hidden = !keys.length;
    els.rarityChips.innerHTML = "";
    keys.forEach(function (key) {
      var active = state.rarity === key;
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip" + (active ? " active" : (state.rarity ? " collapsed" : ""));
      chip.textContent = t("rarity" + (key === "limited" ? "Limited" : "Rare"));
      chip.addEventListener("click", function () {
        state.rarity = active ? null : key;
        render();
      });
      els.rarityChips.appendChild(chip);
    });
    if (state.rarity) {
      appendClearButton(els.rarityChips, function () { state.rarity = null; render(); });
    }
  }

  function renderStats() {
    if (!records.length) { els.stats.innerHTML = ""; return; }
    var artists = {};
    records.forEach(function (r) { if (r.artist) artists[r.artist] = true; });
    var total = 0, priced = 0;
    records.forEach(function (r) {
      var v = parsePrice(r.price);
      if (v !== null) { total += v; priced++; }
    });
    var valueLabel = t("statValue") + (priced < records.length ? " (" + priced + " " + t("countConnector") + " " + records.length + ")" : "");
    // rounded to the nearest €0.5K step, e.g. 2171 -> "€2K", 2350 -> "€2.5K"
    var roundedK = Math.round(total / 500) * 0.5;
    var valueText = "€" + (roundedK % 1 === 0 ? roundedK.toFixed(0) : roundedK.toFixed(1)) + "K";
    var tiles = [
      { value: records.length, label: t("statRecords") },
      { value: Object.keys(artists).length, label: t("statArtists") },
      { value: valueText, label: valueLabel }
    ];
    els.stats.innerHTML = '<div class="stats-row">' + tiles.map(function (tile) {
      return '<div class="stat-item"><span class="stat-val">' + tile.value + '</span><span class="stat-label">' + tile.label + "</span></div>";
    }).join("") + "</div>";
  }

  function coverUrl(r) { return r.coverFile || null; }

  function altText(album) {
    return state.lang === "ru" ? "обложка " + album : album + " cover";
  }

  function shortAlbumTitle(album) {
    var s = (album || "").trim();
    var m;
    while ((m = s.match(/^(.*?)\s*\([^()]*\)\s*$/))) {
      var next = m[1].trim();
      if (!next) break;
      s = next;
    }
    return s;
  }

  function renderGrid() {
    var list = filteredSorted();
    els.count.textContent = records.length ? (list.length + " " + t("countConnector") + " " + records.length) : "";
    els.filterFoot.hidden = !records.length;
    if (!records.length) {
      els.grid.innerHTML =
        '<div class="empty-state">' +
        '<div class="empty-badge"></div>' +
        "<h2>" + t("emptyTitle") + "</h2>" +
        "<p>" + t("emptyBody") + "</p>" +
        "</div>";
      return;
    }
    if (!list.length) {
      els.grid.innerHTML = '<div class="empty-state"><h2>' + t("noMatchesTitle") + '</h2><p>' + t("noMatchesBody") + '</p></div>';
      return;
    }
    var frag = document.createDocumentFragment();
    list.forEach(function (r) {
      var card = document.createElement("div");
      card.className = "card";
      var url = coverUrl(r);
      var coverInner = url
        ? '<img src="' + url + '" alt="' + altText(r.album || "").replace(/"/g, "&quot;") + '" loading="lazy">'
        : '<div class="cover-placeholder"><span>' + t("noCover") + '</span></div>';
      var subBits = [];
      if (r.vinylColor) {
        var vinylTitle = localizeVinylColor(r.vinylColor) + " " + t("vinylWord");
        subBits.push('<span class="vinyl-icon" style="color:' + vinylColorToCss(r.vinylColor) + '" title="' +
          escapeHtml(vinylTitle) + '">' + VINYL_ICON_SVG + "</span>");
      }
      if (r.year && r.pressingYear && r.pressingYear !== r.year) subBits.push("<span>" + r.year + "/" + r.pressingYear + "</span>");
      else if (r.year) subBits.push("<span>" + r.year + "</span>");
      if (r.price) subBits.push('<span class="px">' + escapeHtml(cardPriceText(r.price)) + "</span>");
      card.innerHTML =
        '<div class="cover-wrap">' + coverInner + '<span class="cover-hint">' + EXPAND_ICON_SVG + "</span></div>" +
        '<div class="card-meta">' +
        '<div class="card-artist">' + escapeHtml(r.artist) + "</div>" +
        '<div class="card-album">' + escapeHtml(shortAlbumTitle(r.album)) + "</div>" +
        '<div class="card-sub">' + subBits.join("") + "</div>" +
        "</div>";
      card.addEventListener("click", function () { openDetail(r); });
      frag.appendChild(card);
    });
    els.grid.innerHTML = "";
    els.grid.appendChild(frag);
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render() { renderStats(); renderChips(); renderRarityChips(); renderGrid(); }

  function groupTracksBySide(tracks) {
    var order = [], sides = {};
    (tracks || []).forEach(function (tr) {
      var m = /^([A-Za-z]+)/.exec(tr.position || "");
      var side = m ? m[1].toUpperCase() : "";
      if (!(side in sides)) { sides[side] = []; order.push(side); }
      sides[side].push(tr);
    });
    return order.map(function (s) { return { side: s, tracks: sides[s] }; });
  }

  function openDetail(r) {
    var url = coverUrl(r);
    var coverHtml = url
      ? '<button type="button" class="detail-cover-btn" id="detailCoverBtn">' +
          '<img class="detail-cover" src="' + url + '" alt="' + altText(r.album || "").replace(/"/g, "&quot;") + '">' +
          '<span class="cover-hint">' + EXPAND_ICON_SVG + '</span>' +
        '</button>'
      : '<div class="detail-cover cover-placeholder"><span style="font-size:0.5rem;">' + t("noCover") + '</span></div>';
    var subBits = [];
    if (r.year) subBits.push(r.year);
    if (r.label) subBits.push(escapeHtml(r.label));
    if (r.genre) subBits.push(escapeHtml(r.genre));

    var metaItems = [];
    if (r.year) {
      var isReissue = !!(r.pressingYear && r.pressingYear !== r.year);
      metaItems.push([t("detailEdition"), t(isReissue ? "reissueEdition" : "originalEdition")]);
    }
    if (r.pressingYear && r.pressingYear !== r.year) metaItems.push([t("detailPressingYear"), String(r.pressingYear)]);
    if (r.catalogNo) metaItems.push([t("detailCatalogNo"), escapeHtml(r.catalogNo)]);
    if (r.barcode) metaItems.push([t("detailBarcode"), escapeHtml(r.barcode)]);
    if (r.condition) metaItems.push([t("detailCondition"), escapeHtml(r.condition)]);
    if (r.conditionSleeve) metaItems.push([t("detailConditionSleeve"), escapeHtml(r.conditionSleeve)]);
    if (r.vinylColor) metaItems.push([t("detailVinylColor"), escapeHtml(localizeVinylColor(r.vinylColor))]);
    if (r.rarity === "limited" || r.rarity === "rare") {
      metaItems.push([t("detailRarity"), t(r.rarity === "rare" ? "rarityRare" : "rarityLimited")]);
    }
    if (r.price) metaItems.push([t("detailPrice"), escapeHtml(localizePrice(r.price)) + (r.priceNote ? " (" + escapeHtml(r.priceNote) + ")" : "")]);
    var metaHtml = metaItems.length
      ? '<div class="detail-meta-grid">' + metaItems.map(function (it) {
          return '<div class="detail-meta-item"><div class="detail-meta-label">' + it[0] + '</div><div class="detail-meta-value">' + it[1] + '</div></div>';
        }).join("") + '</div>'
      : "";

    var creditsHtml = r.credits
      ? '<div class="detail-section-title">' + t("detailCreditsTitle") + '</div><div class="detail-credits">' + escapeHtml(r.credits) + '</div>'
      : "";

    var tracklistHtml = "";
    if (r.tracklist && r.tracklist.length) {
      var sides = groupTracksBySide(r.tracklist);
      tracklistHtml = '<div class="detail-section-title">' + t("detailTracklistTitle") + '</div><div class="tracklist-sides">' +
        sides.map(function (s) {
          var heading = s.side ? (t("sideLabel") + " " + s.side) : "";
          return '<div class="tracklist-side">' + (heading ? '<h4>' + heading + '</h4>' : "") +
            s.tracks.map(function (tr) {
              return '<div class="track-row"><span class="track-pos">' + escapeHtml(tr.position) + '</span><span class="track-title">' + escapeHtml(tr.title) + '</span></div>';
            }).join("") + '</div>';
        }).join("") + '</div>';
    }

    var hasExtra = metaItems.length || r.credits || (r.tracklist && r.tracklist.length);

    els.detailBody.innerHTML =
      '<div class="detail-head">' + coverHtml +
        '<div class="detail-titles">' +
          '<h2>' + escapeHtml(r.artist) + '</h2>' +
          '<div class="detail-album">' + escapeHtml(r.album) + '</div>' +
          '<div class="detail-sub">' + subBits.join(" · ") + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="detail-body">' + metaHtml + creditsHtml + tracklistHtml +
        (hasExtra ? "" : '<div class="detail-empty">' + t("detailNoExtra") + '</div>') +
      '</div>';

    var coverBtn = document.getElementById("detailCoverBtn");
    if (coverBtn) {
      coverBtn.addEventListener("click", function () { openLightbox(url, altText(r.album || "")); });
    }

    lockScroll(els.detailDialog);
    els.detailDialog.showModal();
  }

  function openLightbox(url, alt) {
    els.lightboxImg.src = url;
    els.lightboxImg.alt = alt;
    lockScroll(els.lightboxDialog);
    els.lightboxDialog.showModal();
  }
  els.lightboxDialog.addEventListener("click", function () { closeDialog(els.lightboxDialog); });

  els.detailCloseBtn.addEventListener("click", function () { closeDialog(els.detailDialog); });

  els.search.addEventListener("input", function () { state.search = els.search.value; renderGrid(); });
  els.sort.addEventListener("change", function () {
    state.sort = els.sort.value;
    els.sort.setAttribute("aria-label", t(SORT_KEYS[els.sort.value]));
    renderGrid();
  });

  applyLang();
})();
</script>

</body>
</html>
